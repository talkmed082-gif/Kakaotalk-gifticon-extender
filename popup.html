<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 13px;
      }
      input[type="number"] {
        width: 60px;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        cursor: pointer;
      }
      #status {
        font-size: 12px;
        color: #666;
        margin-top: 6px;
        min-height: 16px;
      }
      #lastRun {
        font-size: 12px;
        margin-bottom: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        background: #f2f2f2;
      }
      #lastRun.overdue {
        background: #fff3cd;
        color: #8a6100;
      }
      #log {
        max-height: 200px;
        overflow-y: auto;
        font-size: 12px;
        margin-top: 8px;
        border-top: 1px solid #ddd;
        padding-top: 8px;
      }
      .entry {
        margin-bottom: 6px;
      }
      .success {
        color: #0a7a0a;
      }
      .clicked_no_modal {
        color: #b36b00;
      }
      .no_button {
        color: #888;
      }
    </style>
  </head>
  <body>
    <h1>카카오 기프티콘 유효기간 연장</h1>
    <div id="lastRun"></div>
    <label>자동 실행 <input type="checkbox" id="autoRun" /></label>
    <label
      >연장 대상 (D-<span id="thresholdLabel">30</span> 이내)
      <input type="number" id="threshold" min="1" max="90"
    /></label>
    <button id="runNow">지금 검사 및 연장</button>
    <button id="resetProcessed">처리 기록 초기화</button>
    <div id="status"></div>
    <div id="log"></div>
    <script src="popup.js"></script>
  </body>
</html>
